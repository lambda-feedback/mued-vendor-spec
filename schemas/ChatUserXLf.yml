type: object
description: >
  Lambda Feedback's per-user fields, namespaced under
  `user.vendorExtensions.x-lf` on a Chat request. Carries the learner's
  conversational-style preference and their progress on the current task,
  as tracked by LF's client-backend.
additionalProperties: true
examples:
  - conversationalStyle: "Be concise, encouraging, and avoid giving the answer directly."
    taskProgress:
      timeSpentOnQuestion: 58 minutes
      accessStatus: too much time spent on this question today.
      markedDone: This question is still being worked on.
      currentPart:
        position: 0
        timeSpentOnPart: 37 minutes
        markedDone: This part is not marked done.
        responseAreas:
          - responseType: NUMBER
            totalSubmissions: 1
            wrongSubmissions: 1
            latestSubmission:
              submission: 1
              feedback: Incorrect
              answer: "26"
properties:
  conversationalStyle:
    type:
      - string
      - "null"
    description: >
      Free-text description of the learner's preferred conversational
      style, managed by the LLM itself rather than drawn from a fixed
      enum.
  taskProgress:
    type:
      - object
      - "null"
    description: The learner's progress on the current question.
    allOf:
      - $ref: "./ChatTaskProgress.yml"