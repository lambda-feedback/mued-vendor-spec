type: object
description: >
  Lambda Feedback's evaluation-function configuration, namespaced under
  `configuration.vendorExtensions.x-lf` on an Evaluate request. All fields
  are evaluation-function-defined and vary by grading function in use;
  none are standardized across LF evaluation functions.
additionalProperties: true
examples:
  - gradeParams:
      atol: 0.001
      rtol: 0.01
    cases:
      - answer: "x**2 + 2*x + 1"
        feedback: "Correct — that's the fully expanded form."
        mark: 1.0
        color: green
      - answer: "(x + 1)**2"
        feedback: "Correct, but not fully expanded. Try multiplying it out."
        mark: 0.5
        color: amber
    symbols:
      x:
        latex: x
        aliases: []
      alpha:
        latex: "\\alpha"
        aliases:
          - alpha
    submissionContext:
      submissionsPerStudentPerResponseArea: 3
properties:
  gradeParams:
    type:
      - object
      - "null"
    description: >
      Arbitrary per-response-area grading configuration. Shape is entirely
      defined by the evaluation function selected for this response area;
      µEd-api and this schema make no assumptions about its contents.
    additionalProperties: true
  cases:
    type:
      - array
      - "null"
    description: Optional list of grading cases evaluated against the submission.
    items:
      $ref: "./EvaluateCase.yml"
  symbols:
    type:
      - object
      - "null"
    description: >
      Optional map of symbol code to symbol definition, used by
      symbolic/math evaluation functions to interpret the submission.
    additionalProperties:
      $ref: "./EvaluateSymbol.yml"
  submissionContext:
    type:
      - object
      - "null"
    description: Optional context about the submission's place in a wider attempt history.
    properties:
      submissionsPerStudentPerResponseArea:
        type:
          - integer
          - "null"
        description: Optional count of submissions this student has made for this response area so far.