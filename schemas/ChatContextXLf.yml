type: object
description: >
  Lambda Feedback's conversational-context fields, namespaced under
  `context.vendorExtensions.x-lf` on a Chat request. Carries the running
  conversation summary plus the LF module/set/question the conversation
  is scoped to. Module/set/question have no stable IDs on the wire today
  (see this repo's README, "Current limitations") — only positional
  `number`/`position` values are available.
additionalProperties: true
examples:
  - summary: "Student attempted to convert the binary number 11010 to decimal and got it wrong."
    set:
      title: Computing
      number: 8
      description: Introductory binary and number systems.
    question:
      title: Binary Numbers
      number: 0
      guidance: Convert the given binary number to its decimal equivalent.
      content: Convert the following binary number to decimal.
      estimatedTime: 5-10 minutes
      parts:
        - position: 0
          content: "What is $11010_2$ in decimal?"
          answerContent: "26"
          workedSolutionSections: []
          structuredTutorialSections: []
          responseAreas:
            - position: 0
              responseType: NUMBER
              answer: 26
              preResponseText: "$11010_2 =$"
properties:
  summary:
    type: string
    description: Running summary of the conversation so far, maintained by LF's client.
  set:
    type:
      - object
      - "null"
    description: The problem set the current question belongs to.
    required:
      - title
      - number
      - description
    properties:
      title:
        type: string
        description: Title of the set.
      number:
        type: integer
        description: Ordinal number of the set.
      description:
        type: string
        description: Description of the set.
  question:
    type:
      - object
      - "null"
    description: The question currently in scope for the conversation.
    allOf:
      - $ref: "./ChatQuestion.yml"